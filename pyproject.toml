[project]
name = "hubbleflow"
version = "0.1.0"
description = "A terminal coding agent that runs on the GPU you already own — Ollama, FreeToken or a Mesh LLM node — with Gemini and NVIDIA available when you want them"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Aseem", email = "aseem@hubbleflow.ai" }]
maintainers = [{ name = "Aseem", email = "aseem@hubbleflow.ai" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["llm", "agent", "cli", "local-llm", "ollama", "gemini", "mcp", "coding-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "deepagents>=0.6.12",
    "langchain-google-genai>=2.1.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "rich>=13.9",
    "prompt-toolkit>=3.0.48",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "langchain-ollama>=1.1.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.6.0",
]

# PyPI renders these as the sidebar links; the CI badge and the security
# advisory link in the issue templates use the same owner/repo.
[project.urls]
Homepage = "https://github.com/hubbleflow-ai/hubbleflow-agent-harness"
Repository = "https://github.com/hubbleflow-ai/hubbleflow-agent-harness"
Issues = "https://github.com/hubbleflow-ai/hubbleflow-agent-harness/issues"
Changelog = "https://github.com/hubbleflow-ai/hubbleflow-agent-harness/blob/main/CHANGELOG.md"

[project.scripts]
hubbleflow = "hubbleflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubbleflow"]
# Skills are data, not code, and must travel with the wheel.
artifacts = ["src/hubbleflow/skills/**/*.md"]

[tool.hatch.build.targets.sdist]
include = ["src/hubbleflow", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md",
           "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md", "docs",
           "install.sh", "install.ps1", "uninstall.sh", "uninstall.ps1"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
